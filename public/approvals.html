<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Мои согласования — Система согласования доступов</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><a href="/index.html">Согласование ИТ-доступов</a></div>
    <nav>
      <a href="/index.html">Заявки</a>
      <a href="/approvals.html" id="approvalsLink" hidden>Мои согласования <span id="pendingCount" class="count-badge" hidden>0</span></a>
      <a href="/audit.html" id="auditLink" hidden>Журнал аудита</a>
    </nav>
    <div class="user-info">
      <span id="userName"></span>
      <button id="logoutBtn" class="ghost">Выйти</button>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <h1>Мои согласования</h1>
      <button id="bulkApproveBtn" class="success" disabled>Согласовать выбранные</button>
    </section>

    <section class="filters">
      <button class="quick-filter active" data-filter="pending">Ожидают меня</button>
      <button class="quick-filter" data-filter="urgent">Срочные</button>
      <button class="quick-filter" data-filter="overdue">Просроченные</button>
    </section>

    <table class="grid">
      <thead>
        <tr>
          <th><input type="checkbox" id="selectAll"></th>
          <th>№</th><th>Ресурс</th><th>Тип доступа</th><th>Отдел</th>
          <th>Заявитель</th><th>Приоритет</th><th>Срок</th><th>Создана</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>Заявок, ожидающих согласования, нет</div>
    <div id="bulkError" class="error"></div>
  </main>

  <div id="bulkDialog" class="modal" hidden>
    <div class="modal-box">
      <h2>Массовое согласование</h2>
      <p id="bulkInfo" class="hint"></p>
      <label>Комментарий (необязательно)
        <textarea id="bulkComment" rows="3"></textarea>
      </label>
      <div class="modal-actions">
        <button id="bulkCancel" class="ghost">Отмена</button>
        <button id="bulkConfirm" class="success">Согласовать</button>
      </div>
    </div>
  </div>

  <script src="/app.js"></script>
  <script>app.initApprovals();</script>
</body>
</html>
